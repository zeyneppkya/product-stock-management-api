spring.application.name=product-api
server.port=8080


# --- Swagger / OpenAPI ---

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Endpoint'leri HTTP metoduna, gruplari alfabeye gore sirala
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


# --- Uygulamaya ozel ayarlar ---

# "Az stok" esigi: stogu bu sayidan az olan urunler az stoklu sayilir
app.low-stock-threshold=10


# --- Sayfalama ---

# Istekte "size" verilmezse kullanilan sayfa boyutu
spring.data.web.pageable.default-page-size=20

# Tek istekte istenebilecek en buyuk sayfa boyutu
spring.data.web.pageable.max-page-size=100

# Page nesnesini sabit bir JSON yapisiyla don (content + page)
spring.data.web.pageable.serialization-mode=via_dto


# --- JSON ciktisi ---

spring.jackson.serialization.indent-output=true

# Degeri null olan alanlari JSON'a yazma
spring.jackson.default-property-inclusion=non_null


# --- Veritabani (PostgreSQL) ---

spring.datasource.url=jdbc:postgresql://localhost:5432/product_db
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=org.postgresql.Driver


# --- JPA / Hibernate ---

# Tablolari entity'lere gore otomatik olustur / guncelle
spring.jpa.hibernate.ddl-auto=update

# Uretilen SQL sorgularini konsola okunakli bicimde yaz
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Varsayilan (true) degerde Spring'in acilista verdigi uyariyi kapatir
spring.jpa.open-in-view=false

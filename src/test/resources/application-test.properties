
#  TEST PROFILI

# Testler PostgreSQL'e ihtiyac duymasin diye bellek ici H2 veritabani kullanilir.
# Bu dosya sadece "test" profili aktifken (@ActiveProfiles("test")) okunur
# ve application.properties'teki ayni isimli ayarlari ezer.

spring.datasource.url=jdbc:h2:mem:product_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tablolari test basinda olustur, bitince sil
spring.jpa.hibernate.ddl-auto=create-drop

# Test ciktisi SQL ile dolmasin
spring.jpa.show-sql=false
